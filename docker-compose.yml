services:
  minio-a:
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    container_name: minio-a
    hostname: minio-a
    user: "0:0"
    command: server /data --console-address ":9001"
    profiles:
      - region-a
      - all
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./volumes/region-a/minio-data:/data
    networks:
      - net-region-a
      - net-wan
    ports:
      - "${REGION_A_PORT:-9001}:9000"
      - "${REGION_A_CONSOLE_PORT:-9002}:9001"
    restart: unless-stopped

  minio-b:
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    container_name: minio-b
    hostname: minio-b
    user: "0:0"
    command: server /data --console-address ":9001"
    profiles:
      - region-b
      - all
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./volumes/region-b/minio-data:/data
    networks:
      - net-region-b
      - net-wan
    ports:
      - "${REGION_B_PORT:-9011}:9000"
      - "${REGION_B_CONSOLE_PORT:-9012}:9001"
    restart: unless-stopped

  minio-provision:
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    container_name: minio-provision
    profiles:
      - provision
      - all
    entrypoint: ["/bin/sh", "/scripts/provision.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      REPL_USER: ${REPL_USER}
      REPL_PASSWORD: ${REPL_PASSWORD}
      BUCKET_NAME: ${BUCKET_NAME:-data-bucket}
    volumes:
      - ./scripts/setup/provision.sh:/scripts/provision.sh:ro
    networks:
      - net-wan
    depends_on:
      - minio-a
      - minio-b
    restart: "no"

  global-proxy:
    image: nginx@sha256:208b70eefac13ee9be00e486f79c695b15cef861c680527171a27d253d834be9
    container_name: global-proxy
    hostname: global-proxy
    profiles:
      - global
      - all
    volumes:
      - ./config/global:/etc/nginx/conf.d
    networks:
      - net-wan
    ports:
      - "${GLOBAL_PORT:-8000}:8000"
    restart: unless-stopped

  failover-controller:
    build:
      context: ./controllers/failover
      dockerfile: Dockerfile
    image: ha-data-platform-failover-controller:dev
    container_name: failover-controller
    hostname: failover-controller
    profiles:
      - global
      - all
    environment:
      PRIMARY_ENDPOINT: "http://minio-a:9000/minio/health/live"
      PRIMARY_HOST: "minio-a"
      SECONDARY_HOST: "minio-b"
      BACKEND_PORT: "9000"
      GLOBAL_PROXY_URL: "http://global-proxy:8000/minio/health/live"
      HEALTHCHECK_INTERVAL_SECONDS: ${HEALTHCHECK_INTERVAL_SECONDS:-1.0}
      PROBE_TIMEOUT_SECONDS: ${PROBE_TIMEOUT_SECONDS:-0.5}
      FAILOVER_THRESHOLD: ${FAILOVER_THRESHOLD:-3}
      CONFIG_PATH: "/etc/nginx/conf.d/nginx.conf"
      TEMPLATE_PATH: "/etc/nginx/conf.d/nginx.conf.template"
      METRICS_FILE: "/var/log/metrics/failover_rto.log"
      FAILURE_TIMESTAMP_FILE: "/var/log/metrics/failure.timestamp"
      DOCKER_SOCKET: "/var/run/docker.sock"
      PROXY_CONTAINER_NAME: "global-proxy"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/global:/etc/nginx/conf.d
      - ./volumes/metrics:/var/log/metrics
    networks:
      - net-wan
    depends_on:
      - global-proxy
    restart: unless-stopped

networks:
  net-region-a:
    name: net-region-a
    driver: bridge
  net-region-b:
    name: net-region-b
    driver: bridge
  net-wan:
    name: net-wan
    driver: bridge
